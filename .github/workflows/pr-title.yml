name: PR title

# PRs are squash-merged, so the PR title becomes the commit on main that release-please
# reads. Advisory, not a required check: release-please's own PRs (opened with
# GITHUB_TOKEN) never trigger workflows, so a required check would block every release.
# Woodpecker can't host it either: title edits reach it only as `pull_request_metadata`
# events, which report under a different check name.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional:
    name: Conventional Commit
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
