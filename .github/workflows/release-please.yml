name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re)build and upload binary assets for, bypassing release-please (e.g. v0.2.0)"
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  release-please:
    name: Release Please
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        # release-type, bootstrap-sha, and package config all live in
        # release-please-config.json / .release-please-manifest.json (default paths)

  build:
    name: Build (${{ matrix.os }})
    needs: release-please
    if: |
      !cancelled() &&
      (needs.release-please.result == 'skipped' || needs.release-please.outputs.release_created == 'true')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      RELEASE_TAG: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7 # stable branch tip

      - name: Rust cache
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2

      - name: Build
        run: cargo build --release --locked

      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          TARGET="$(rustc -vV | sed -n 's/^host: //p')"
          DIST="pacmagic-${RELEASE_TAG}-${TARGET}"
          mkdir -p "dist/${DIST}"
          cp "target/release/pacmagic" "dist/${DIST}/"
          cp "README.md" "LICENSE" "dist/${DIST}/"
          (cd dist && tar -czf "${DIST}.tar.gz" "${DIST}")

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $targetLine = rustc -vV | Select-String '^host: '
          $target = $targetLine.Line.Split(' ')[1]
          $dist = "pacmagic-$env:RELEASE_TAG-$target"
          New-Item -ItemType Directory -Force -Path "dist\$dist" | Out-Null
          Copy-Item "target\release\pacmagic.exe" "dist\$dist\"
          Copy-Item "README.md","LICENSE" "dist\$dist\"
          Compress-Archive -Path "dist\$dist" -DestinationPath "dist\$dist.zip" -Force

      - name: Upload packaged artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: dist-${{ matrix.os }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  publish:
    name: Attach binaries to GitHub Release
    needs: [release-please, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true

      - name: Upload assets to the release
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2.5.0
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
          files: |
            dist/**/*.tar.gz
            dist/**/*.zip
