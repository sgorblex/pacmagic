# `ci:pause` pauses this pipeline too - see lint.yaml.
when:
  - event: push
    branch: main
  - event: pull_request
    evaluate: 'not ("ci:pause" in split(CI_COMMIT_PULL_REQUEST_LABELS, ","))'

steps:
  - name: test
    image: rust:1.97.0-slim-trixie@sha256:686a437ead83701e8f871e66e838c3ec55f46b5fc235b025756396ac823bdc51
    volumes:
      - /var/lib/woodpecker-cache/cargo-home:/cache/cargo-home
      - /var/lib/woodpecker-cache/pacmagic-target-test:/cache/target
    environment:
      CARGO_HOME: /cache/cargo-home
      CARGO_TARGET_DIR: /cache/target
      CARGO_TERM_COLOR: always
    # Path filtering here, not top-level - see lint.yaml for why.
    when:
      - event: push
        branch: main
        path:
          include: &test-paths ['src/**', 'Cargo.toml', 'Cargo.lock', '.woodpecker/test.yaml']
      - event: pull_request
        path:
          include: *test-paths
    commands:
      - cargo test --all-targets --all-features --locked
