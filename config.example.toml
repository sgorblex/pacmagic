# PacMagic Configuration File
# This is an example configuration. Copy to ~/.config/pacmagic/config.toml and customize.

[general]
# Default package manager ("auto" for auto-detection)
default_package_manager = "auto"

# Confirm before installing packages
confirm_before_install = true

# Enable verbose output by default
verbose = false

# Use sudo by default
use_sudo = true

# Default behavior when installing packages that are already installed
# Options: "default" (package manager default), "upgrade", "reinstall", "skip"
install_behavior = "default"

# Default command to run when pacmagic is invoked without arguments
# Set to an alias name (e.g., "full-upgrade") or an operation name
# If not set, pacmagic will show an error when run without arguments
default_command = "full-upgrade"

# Command aliases
# Map short commands to operations
# Aliases can be single operations or sequences of operations (arrays)
[aliases]
i = "install"
rm = "remove"
up = "update"
upg = "upgrade"
s = "search"
ls = "list"
info = "info"
clean = "clean"

# Multi-command aliases: run multiple operations in sequence
# Example: "full-upgrade" runs update, upgrade-all, autoremove, and clean
full-upgrade = ["update", "upgrade-all", "autoremove", "clean"]

# You can create custom sequences for common workflows
sync = ["update", "upgrade-all"]
cleanup = ["autoremove", "clean"]

# Package manager specific configuration
[package_managers.apt]
enabled = true
use_sudo = true
extra_flags = []

[package_managers.pacman]
enabled = true
use_sudo = true
extra_flags = []

[package_managers.paru]
enabled = true
use_sudo = false  # Paru handles sudo internally
extra_flags = []

[package_managers.brew]
enabled = true
use_sudo = false
extra_flags = []

[package_managers.dnf]
enabled = true
use_sudo = true
extra_flags = []

[package_managers.winget]
enabled = true
use_sudo = false
extra_flags = []


