[tools]
rust = { version = "1.97.0", profile = "default", targets = "x86_64-pc-windows-gnu,aarch64-apple-darwin" }
"github:EmbarkStudios/cargo-deny" = "0.20.2"
"github:bnjbvr/cargo-machete" = "0.9.2"

[env]
CARGO_TERM_COLOR = "always"

[tasks.test]
description = "Run tests"
run = "cargo test --all-targets --all-features --locked"

[tasks.lint]
description = "Run clippy linter"
run = "cargo clippy --all-targets --all-features --locked -- -D warnings"

[tasks.lint-targets]
hide = true
description = "Run clippy for the Windows and macOS targets (cfg-gated code a host run skips)"
run = [
  "cargo clippy --target x86_64-pc-windows-gnu --all-targets --all-features --locked -- -D warnings",
  "cargo clippy --target aarch64-apple-darwin --all-targets --all-features --locked -- -D warnings",
]

[tasks.format]
alias = "fmt"
description = "Format code with rustfmt"
run = "cargo fmt --all"

[tasks.fix]
description = "Apply clippy auto-fixes, then format"
run = [
  "cargo clippy --fix --allow-dirty --all-targets --all-features --locked",
  "cargo fmt --all",
]

[tasks.fmt-check]
hide = true
description = "Check formatting with rustfmt (no changes)"
run = "cargo fmt --all -- --check"

[tasks.check]
description = "Check code without building"
run = "cargo check --all-targets --all-features --locked"

[tasks.build]
description = "Build release binary"
run = "cargo build --release --locked"

[tasks.dev]
description = "Run PacMagic in dev mode"
run = "cargo run --locked --"

[tasks.clean]
description = "Clean build artifacts"
run = "cargo clean"

[tasks.doc]
description = "Build and open documentation"
run = "cargo doc --locked --open --no-deps"

[tasks.doc-check]
hide = true
description = "Check documentation builds without warnings"
env = { RUSTDOCFLAGS = "-D warnings" }
run = "cargo doc --no-deps --all-features --locked"

[tasks.deny]
hide = true
description = "Check dependencies for vulnerabilities and license compliance"
run = "cargo deny check advisories licenses sources bans"

[tasks.machete]
hide = true
description = "Check for unused dependencies"
run = "cargo machete"

[tasks.msrv]
hide = true
description = "Check the crate builds on the MSRV (rust-version in Cargo.toml)"
run = '''
v=$(sed -n 's/^rust-version *= *"\(.*\)"/\1/p' Cargo.toml | head -1)
rustup toolchain install "$v" --profile minimal
cargo "+$v" check --all-targets --all-features --locked
'''

[tasks.check-all]
alias = "all"
description = "Every CI check (fmt, clippy incl. cross-targets, test, deny, docs, MSRV, machete)"
depends = ["fmt-check", "lint", "lint-targets", "test", "deny", "doc-check", "msrv", "machete"]
