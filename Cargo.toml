[package]
name = "pacmagic"
version = "0.1.0"
edition = "2021"
authors = ["sgorblex"]
description = "A universal, extensible package manager wrapper"
license = "MIT"
repository = "https://github.com/sgorblex/pacmagic"
keywords = ["package-manager", "wrapper", "cli"]
categories = ["command-line-utilities"]

[dependencies]
# CLI parsing
clap = { version = "4.4", features = ["derive", "cargo"] }

# Serialization for config
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Async runtime (for potential future use)
tokio = { version = "1.35", features = ["full"], optional = true }

# Process execution
which = "8.0"

# Logging
log = "0.4"
env_logger = "0.11"

# Platform detection
cfg-if = "1.0"
dirs = "6.0"

# Shell command parsing for completions
shell-words = "1.1"

[dev-dependencies]
mockall = "0.13"
tempfile = "3.8"

[features]
default = []
async = ["tokio"]

[[bin]]
name = "pacmagic"
path = "src/main.rs"

[lib]
name = "pacmagic"
path = "src/lib.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
